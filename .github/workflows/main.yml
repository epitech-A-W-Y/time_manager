
name: Mirroring

on: [push, delete]

jobs:
  to_school:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - uses: pixta-dev/repository-mirroring-action@v1
        with:
          target_repo_url: git@github.com:Epitech2026-2027/I-DEV-700-INT-7-1-timemanager-28.git
          ssh_private_key: ${{ secrets.TARGET_SSH_PRIVATE_KEY }}