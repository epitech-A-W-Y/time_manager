services:
  phoenix:
    build: .
    depends_on:
      - db
    environment:
      PGUSER: ${PGUSER}
      PGPASSWORD: ${PGPASSWORD}
      PGDATABASE: ${PGDATABASE}
      PGPORT: 5432
      PGHOST: db
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      PHX_SERVER: "true"
      DATABASE_URL: ecto://${PGUSER}:${PGPASSWORD}@db:5432/${PGDATABASE}
    ports:
      - "4000:4000"

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: ${PGDATABASE}
    ports:
      - "${PGPORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
